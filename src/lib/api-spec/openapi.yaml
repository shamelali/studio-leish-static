openapi: 3.0.3
info:
  title: Leish Studio API
  version: 1.0.0
  description: API for Leish Studio Admin Dashboard

servers:
  - url: http://localhost:5000
    description: Development server

paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK

  /api/bookings:
    get:
      summary: List bookings
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
    post:
      summary: Create booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '201':
          description: Created

  /api/bookings/{id}:
    get:
      summary: Get booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking
    put:
      summary: Update booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted

  /api/rooms:
    get:
      summary: List rooms
      responses:
        '200':
          description: List of rooms
    post:
      summary: Create room
      responses:
        '201':
          description: Created

  /api/rooms/{id}:
    get:
      summary: Get room by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Room

  /api/users:
    get:
      summary: List users
      responses:
        '200':
          description: List of users

  /api/reviews:
    get:
      summary: List reviews
      responses:
        '200':
          description: List of reviews

  /api/images:
    get:
      summary: List images
      responses:
        '200':
          description: List of images
    post:
      summary: Upload image
      responses:
        '201':
          description: Created

  /api/settings:
    get:
      summary: Get settings
      responses:
        '200':
          description: List of settings
    put:
      summary: Update settings
      responses:
        '200':
          description: Updated

  /api/analytics:
    get:
      summary: Get analytics
      responses:
        '200':
          description: Analytics data

components:
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: integer
        clientName:
          type: string
        clientEmail:
          type: string
        room:
          type: string
        date:
          type: string
        time:
          type: string
        totalAmount:
          type: number
        status:
          type: string
        paymentStatus:
          type: string
        createdAt:
          type: string
          format: date-time

    BookingInput:
      type: object
      required:
        - clientName
        - clientEmail
        - room
        - date
        - time
      properties:
        clientName:
          type: string
        clientEmail:
          type: string
        clientPhone:
          type: string
        room:
          type: string
        date:
          type: string
        time:
          type: string
        sessionType:
          type: string
        totalAmount:
          type: number
        notes:
          type: string